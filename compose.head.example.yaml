# Fragment to add under `services:` in /pds/compose.yaml on the droplet
# (that file is not tracked here). Replace <sha> with the social-app commit
# the GHCR workflow built (tag `head-<sha>`). The web root is bind-mounted
# read-only so the service reads the same index.html Caddy's file_server
# serves; it re-reads on mtime change, so a web deploy needs no restart.
  head:
    container_name: head
    image: ghcr.io/alamaa-1999/social-app:head-<sha>
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /pds/caddy/etc/caddy/sunnahsky-web
        target: /web
        read_only: true
    env_file:
      - /pds/head.env
